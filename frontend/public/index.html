<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NIFTY 50 — Professional Chart Engine</title>
<meta name="description" content="TradingView-style multi-timeframe bar replay for NIFTY 50">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{
  --bg0:#0d1117;--bg1:#131722;--bg2:#1e222d;--bg3:#2a2e39;--bg4:#363a4e;
  --border:#2e3347;--border2:#4a4f62;
  --txt:#d1d4dc;--txt2:#787b86;--txt3:#4a4f62;
  --accent:#2962ff;--accent2:#1e53e5;
  --green:#26a69a;--green2:#00B050;
  --red:#ef5350;--red2:#FF3A3A;
  --gold:#f59e0b;--purple:#9c27b0;--orange:#ff9800;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',Consolas,monospace;
  --r:5px;--r2:9px;
  --shadow:0 8px 32px rgba(0,0,0,.6);
  --tr:.13s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg0);color:var(--txt);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased}

/* ── LOADING ─────────────────────────────────────── */
#loading{position:fixed;inset:0;background:var(--bg0);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#loading-logo{font-size:32px;font-weight:800;letter-spacing:-1px;color:var(--accent)}
.spin{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-text{color:var(--txt2);font-size:14px}

/* ── TOOLBAR ─────────────────────────────────────── */
#toolbar{
  height:46px;display:flex;align-items:center;gap:5px;
  padding:0 10px;background:var(--bg2);border-bottom:1px solid var(--border);
  position:relative;z-index:100;overflow-x:auto;scrollbar-width:none;flex-shrink:0
}
#toolbar::-webkit-scrollbar{display:none}
.sym-box{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:var(--r);background:var(--bg4);border:1px solid var(--border2);cursor:default}
.sym-name{font-weight:700;font-size:14px}
.sym-ex{font-size:10px;color:var(--txt2);text-transform:uppercase}
.divider{width:1px;height:22px;background:var(--border);flex-shrink:0;margin:0 3px}

.tf-btn{padding:4px 8px;border:none;border-radius:var(--r);background:transparent;color:var(--txt2);font-size:12px;font-weight:600;cursor:pointer;transition:var(--tr);white-space:nowrap;font-family:var(--font)}
.tf-btn:hover{background:var(--bg4);color:var(--txt)}
.tf-btn.active{background:var(--accent);color:#fff}

.tb-btn{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg2);color:var(--txt);font-size:12px;font-weight:600;cursor:pointer;transition:var(--tr);white-space:nowrap;font-family:var(--font)}
.tb-btn:hover{background:var(--bg4);border-color:var(--border2)}
.tb-btn.on{background:var(--bg4);border-color:var(--accent);color:var(--accent)}

/* jump to date */
#jump-date{padding:4px 8px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);color:var(--txt);font-size:11px;outline:none;cursor:pointer}
#jump-date:focus{border-color:var(--accent)}
#jump-date::-webkit-calendar-picker-indicator{filter:invert(.5)}

#tb-right{margin-left:auto;display:flex;align-items:center;gap:5px;flex-shrink:0}

/* ── DRAWING SIDEBAR ─────────────────────────────── */
#draw-bar{
  position:absolute;left:0;top:46px;bottom:0;width:42px;
  background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;
  padding:6px 0;gap:3px;z-index:50
}
.d-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:var(--r);border:none;background:transparent;color:var(--txt2);font-size:14px;cursor:pointer;transition:var(--tr);position:relative}
.d-btn:hover{background:var(--bg4);color:var(--txt)}
.d-btn.active{background:var(--accent);color:#fff}
.d-btn[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:38px;top:50%;transform:translateY(-50%);background:var(--bg3);border:1px solid var(--border2);color:var(--txt);padding:3px 8px;border-radius:var(--r);font-size:11px;white-space:nowrap;pointer-events:none;z-index:999}
.d-sep{width:20px;height:1px;background:var(--border);margin:3px 0}

/* ── MAIN LAYOUT ─────────────────────────────────── */
#shell{display:flex;flex-direction:column;height:calc(100vh - 46px);margin-left:42px}
#chart-wrap{display:flex;flex-direction:column;flex:1;min-height:0;position:relative}
#main-chart{flex:1;min-height:0;position:relative}
#lwc{width:100%;height:100%}

/* ── CROSSHAIR TOOLTIP ───────────────────────────── */
#xhair{
  position:absolute;top:8px;left:8px;
  display:none;flex-wrap:wrap;gap:10px;
  background:rgba(19,23,34,.92);border:1px solid var(--border2);
  border-radius:var(--r);padding:5px 10px;
  font-family:var(--mono);font-size:11px;pointer-events:none;z-index:200;
  backdrop-filter:blur(4px)
}
#xhair.show{display:flex}
.xh-item{display:flex;flex-direction:column;gap:1px}
.xh-label{color:var(--txt3);font-size:9px;text-transform:uppercase;letter-spacing:.5px}
.xh-val{color:var(--txt);font-weight:600}
.xh-green{color:var(--green)}
.xh-red{color:var(--red)}

/* ── LEGEND ──────────────────────────────────────── */
#legend{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:3px;pointer-events:none;z-index:30}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;background:rgba(19,23,34,.85);padding:2px 7px;border-radius:3px;pointer-events:auto;border:1px solid var(--border)}
.leg-dot{width:12px;height:2px;border-radius:2px;flex-shrink:0}
.leg-gear{background:none;border:none;color:var(--txt2);font-size:11px;cursor:pointer;padding:0 2px}
.leg-gear:hover{color:var(--txt)}
.leg-x{background:none;border:none;color:var(--txt3);font-size:12px;cursor:pointer;padding:0 2px}
.leg-x:hover{color:var(--red)}

/* ── PANE AREA ───────────────────────────────────── */
#pane-area{flex-shrink:0}
.ind-pane{position:relative;border-top:1px solid var(--border);min-height:110px}
.pane-lbl{position:absolute;top:5px;left:8px;font-size:10px;color:var(--txt2);font-weight:600;z-index:5;pointer-events:none}
.pane-x{position:absolute;top:3px;right:6px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:none;background:transparent;color:var(--txt3);font-size:13px;cursor:pointer;z-index:10}
.pane-x:hover{background:var(--bg4);color:var(--red)}
.pane-chart-div{width:100%;height:100%}

/* ── REPLAY BAR ──────────────────────────────────── */
#replay-bar{
  display:flex;align-items:center;gap:8px;padding:7px 12px;
  background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0;z-index:40
}
.r-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:var(--r);border:1px solid var(--border);background:var(--bg2);color:var(--txt);font-size:13px;cursor:pointer;transition:var(--tr);flex-shrink:0}
.r-btn:hover{background:var(--bg4)}
.r-btn.play{background:var(--green);border-color:var(--green);color:#fff}
.r-btn.pause{background:var(--red);border-color:var(--red);color:#fff}
.r-btn:disabled{opacity:.35;cursor:not-allowed}

#rslider{flex:1;height:4px;border-radius:2px;background:var(--border2);outline:none;cursor:pointer;-webkit-appearance:none}
#rslider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;transition:transform var(--tr);box-shadow:0 0 4px rgba(0,0,0,.4)}
#rslider::-webkit-slider-thumb:hover{transform:scale(1.3)}

.spd-grp{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--txt2);flex-shrink:0}
#spd-slider{width:70px;cursor:pointer}
#status{font-family:var(--mono);font-size:11px;color:var(--txt2);white-space:nowrap;padding:3px 9px;background:var(--bg1);border-radius:var(--r);border:1px solid var(--border);min-width:200px}

/* ── POPUPS ──────────────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:900;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.overlay.open{display:flex}
.popup{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);box-shadow:var(--shadow);display:flex;flex-direction:column;animation:pop .14s ease}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-8px)}to{opacity:1;transform:none}}
.pop-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
.pop-title{font-size:14px;font-weight:600}
.pop-close{background:none;border:none;color:var(--txt2);font-size:17px;cursor:pointer;line-height:1;padding:2px 6px;border-radius:var(--r)}
.pop-close:hover{background:var(--bg4);color:var(--red)}

/* Indicator library */
#ind-popup .popup{width:500px;max-height:76vh}
#ind-search{margin:10px 14px;padding:7px 11px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);color:var(--txt);font-size:13px;outline:none;font-family:var(--font);transition:var(--tr)}
#ind-search:focus{border-color:var(--accent)}
#ind-search::placeholder{color:var(--txt3)}
#ind-list{flex:1;overflow-y:auto;padding:4px 0;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.ind-cat{padding:5px 16px 2px;font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:1px;margin-top:6px}
.ind-row{display:flex;align-items:center;padding:7px 16px;cursor:pointer;transition:var(--tr);gap:9px}
.ind-row:hover{background:var(--bg4)}
.badge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;flex-shrink:0}
.b-ovl{background:rgba(41,98,255,.2);color:var(--accent)}
.b-pane{background:rgba(239,83,80,.2);color:var(--red)}
.ind-name{font-weight:500;flex:1}
.ind-desc{font-size:11px;color:var(--txt2)}
.add-btn{padding:3px 9px;border-radius:var(--r);border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:11px;font-weight:600;cursor:pointer;transition:var(--tr);white-space:nowrap;font-family:var(--font)}
.add-btn:hover{background:var(--accent);color:#fff}

/* Settings */
#set-popup .popup{width:360px;max-height:80vh}
.set-form{padding:14px 18px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;scrollbar-width:thin}
.set-row{display:flex;flex-direction:column;gap:4px}
.set-lbl{font-size:10px;color:var(--txt2);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.set-inp{padding:6px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);color:var(--txt);font-size:13px;outline:none;font-family:var(--font);transition:var(--tr);width:100%}
.set-inp:focus{border-color:var(--accent)}
.set-inp[type=color]{padding:2px 5px;height:32px;cursor:pointer}
.set-sel{padding:6px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);color:var(--txt);font-size:13px;outline:none;width:100%;cursor:pointer}
.pop-foot{padding:10px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.btn-ok{padding:7px 16px;background:var(--accent);border:none;color:#fff;border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font)}
.btn-ok:hover{background:var(--accent2)}
.btn-cancel{padding:7px 16px;background:transparent;border:1px solid var(--border);color:var(--txt2);border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font)}
.btn-cancel:hover{background:var(--bg4);color:var(--txt)}

/* ── TOAST ───────────────────────────────────────── */
#toast{position:fixed;bottom:72px;right:16px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:8px 14px;font-size:12px;color:var(--txt);box-shadow:var(--shadow);z-index:1000;opacity:0;transform:translateY(8px);transition:all .22s ease;pointer-events:none}
#toast.show{opacity:1;transform:none}

/* ── DRAWING CURSOR ──────────────────────────────── */
#lwc.draw-cursor{cursor:crosshair}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div id="loading-logo">📈 NIFTY Engine</div>
  <div class="spin"></div>
  <div id="loading-text">Initialising…</div>
</div>

<!-- TOOLBAR -->
<div id="toolbar">
  <div class="sym-box"><div><div class="sym-name">NIFTY 50</div><div class="sym-ex">NSE · INDEX</div></div></div>
  <div class="divider"></div>
  <button class="tf-btn" data-tf="1m"  onclick="switchTF('1m')">1m</button>
  <button class="tf-btn" data-tf="3m"  onclick="switchTF('3m')">3m</button>
  <button class="tf-btn" data-tf="5m"  onclick="switchTF('5m')">5m</button>
  <button class="tf-btn" data-tf="15m" onclick="switchTF('15m')">15m</button>
  <button class="tf-btn" data-tf="30m" onclick="switchTF('30m')">30m</button>
  <button class="tf-btn" data-tf="45m" onclick="switchTF('45m')">45m</button>
  <button class="tf-btn" data-tf="1H"  onclick="switchTF('1H')">1H</button>
  <button class="tf-btn" data-tf="2H"  onclick="switchTF('2H')">2H</button>
  <button class="tf-btn" data-tf="4H"  onclick="switchTF('4H')">4H</button>
  <button class="tf-btn" data-tf="D"   onclick="switchTF('D')">D</button>
  <button class="tf-btn" data-tf="W"   onclick="switchTF('W')">W</button>
  <div class="divider"></div>
  <button class="tb-btn" onclick="openIndLib()">ƒ Indicators</button>
  <button class="tb-btn on" id="zone-btn" onclick="toggleZones()">⬛ Zones</button>
  <div class="divider"></div>
  <label style="font-size:11px;color:var(--txt2);white-space:nowrap">Jump to:</label>
  <input type="date" id="jump-date" onchange="jumpToDate(this.value)" title="Jump replay to date">

  <div id="tb-right">
    <button class="tb-btn" onclick="fitChart()" title="Fit (F)">⊞ Fit</button>
    <button class="tb-btn" onclick="takeScreenshot()" title="Screenshot">📷</button>
    <button class="tb-btn" onclick="openMonthly()">📅 Monthly</button>
  </div>
</div>

<!-- DRAWING TOOLS SIDEBAR -->
<div id="draw-bar">
  <button class="d-btn active" data-tool="cursor"    data-tip="Cursor (V)"            onclick="setTool('cursor')"   id="tool-cursor">↖</button>
  <button class="d-btn"        data-tool="hline"     data-tip="H-Line (H)"            onclick="setTool('hline')">—</button>
  <button class="d-btn"        data-tool="trendline" data-tip="Trend Line (T)"         onclick="setTool('trendline')">╱</button>
  <button class="d-btn"        data-tool="ray"       data-tip="Ray (R)"               onclick="setTool('ray')">→</button>
  <button class="d-btn"        data-tool="rect"      data-tip="Rectangle (G)"         onclick="setTool('rect')">▭</button>
  <button class="d-btn"        data-tool="fib"       data-tip="Fib Retracement (B)"   onclick="setTool('fib')">🌀</button>
  <button class="d-btn"        data-tool="arrow"     data-tip="Arrow (A)"             onclick="setTool('arrow')">↑</button>
  <div class="d-sep"></div>
  <div style="flex:1"></div>
  <button class="d-btn" data-tip="Clear Drawings" onclick="clearDrawings()" style="color:var(--red)">🗑</button>
</div>

<!-- MAIN SHELL -->
<div id="shell">
  <div id="chart-wrap">
    <div id="main-chart">
      <div id="lwc"></div>
      <!-- Crosshair tooltip -->
      <div id="xhair">
        <div class="xh-item"><div class="xh-label">Date</div><div class="xh-val" id="xh-date">—</div></div>
        <div class="xh-item"><div class="xh-label">Time</div><div class="xh-val" id="xh-time">—</div></div>
        <div class="xh-item"><div class="xh-label">O</div><div class="xh-val" id="xh-o">—</div></div>
        <div class="xh-item"><div class="xh-label">H</div><div class="xh-val xh-green" id="xh-h">—</div></div>
        <div class="xh-item"><div class="xh-label">L</div><div class="xh-val xh-red"   id="xh-l">—</div></div>
        <div class="xh-item"><div class="xh-label">C</div><div class="xh-val" id="xh-c">—</div></div>
        <div class="xh-item"><div class="xh-label">Chg%</div><div class="xh-val" id="xh-chg">—</div></div>
      </div>
      <!-- Legend -->
      <div id="legend"></div>
    </div>
    <!-- Sub-panel area -->
    <div id="pane-area"></div>
  </div>

  <!-- REPLAY BAR -->
  <div id="replay-bar">
    <button class="r-btn" id="btn-rst"  onclick="resetReplay()"  title="Reset (Home)">⏮</button>
    <button class="r-btn" id="btn-bk"   onclick="stepBack()"     title="Back (←)">◀</button>
    <button class="r-btn play" id="btn-play" onclick="togglePlay()" title="Play/Pause (Space)">▶</button>
    <button class="r-btn" id="btn-fwd"  onclick="stepFwd()"      title="Forward (→)">▶|</button>
    <button class="r-btn" id="btn-end"  onclick="goEnd()"        title="End (End)">⏭</button>

    <input type="range" id="rslider" min="0" max="999" value="100" oninput="scrubTo(this.value)" title="Replay position">

    <div class="spd-grp">
      <span>Speed:</span>
      <input type="range" id="spd-slider" min="50" max="8000" step="50" value="800" oninput="setSpeed(this.value)">
      <span id="spd-lbl">0.8s</span>
    </div>
    <div id="status">Ready…</div>
  </div>
</div>

<!-- INDICATOR LIBRARY POPUP -->
<div class="overlay" id="ind-popup">
  <div class="popup" style="width:510px;max-height:78vh">
    <div class="pop-head">
      <span class="pop-title">📊 Indicator Library</span>
      <button class="pop-close" onclick="closePopup('ind-popup')">✕</button>
    </div>
    <input type="text" id="ind-search" placeholder="🔍  Search indicators…" oninput="filterInds(this.value)" autocomplete="off">
    <div id="ind-list"></div>
  </div>
</div>

<!-- SETTINGS POPUP -->
<div class="overlay" id="set-popup">
  <div class="popup" id="set-popup-inner">
    <div class="pop-head">
      <span class="pop-title" id="set-title">Settings</span>
      <button class="pop-close" onclick="closePopup('set-popup')">✕</button>
    </div>
    <div class="set-form" id="set-form"></div>
    <div class="pop-foot">
      <button class="btn-cancel" onclick="closePopup('set-popup')">Cancel</button>
      <button class="btn-ok" onclick="applySettings()">Apply</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
'use strict';

// ════════════════════════════════════════════════════════════════
// CUSTOM CANVAS PRIMITIVES FOR LWC v4
// These use the official ISeriesPrimitive / IPrimitivePaneView API.
// Each class acts as: primitive + pane-view + pane-renderer in one.
// ════════════════════════════════════════════════════════════════

/** Filled rectangle with border — used for ALL zone types */
class RectPrimitive {
  constructor(chart, series, t1, topPrice, t2, botPrice, fill, stroke) {
    this._c = chart; this._s = series;
    this._t1 = t1; this._t2 = t2;
    this._top = Math.max(topPrice, botPrice);
    this._bot = Math.min(topPrice, botPrice);
    this._fill = fill; this._stroke = stroke;
    this._visible = true;
  }
  hide()     { this._visible = false; }
  show()     { this._visible = true; }
  setT2(t2)  { this._t2 = t2; }
  setFill(f) { this._fill = f; }

  updateAllViews() {}
  paneViews()  { return [this]; }
  renderer()   { return this; }
  zOrder()     { return 'bottom'; }

  draw(target) {
    if (!this._visible) return;
    target.useBitmapCoordinateSpace(({ context: ctx, horizontalPixelRatio: hr, verticalPixelRatio: vr }) => {
      const x1 = this._c.timeScale().timeToCoordinate(this._t1);
      const x2 = this._c.timeScale().timeToCoordinate(this._t2);
      const y1 = this._s.priceToCoordinate(this._top);
      const y2 = this._s.priceToCoordinate(this._bot);
      if (x1 == null || x2 == null || y1 == null || y2 == null) return;
      const bx1 = Math.round(Math.min(x1,x2)*hr), bx2 = Math.round(Math.max(x1,x2)*hr);
      const by1 = Math.round(Math.min(y1,y2)*vr), by2 = Math.round(Math.max(y1,y2)*vr);
      const w = bx2-bx1, h = by2-by1;
      if (w < 1 || h < 1) return;
      ctx.fillStyle   = this._fill;    ctx.fillRect(bx1, by1, w, h);
      ctx.strokeStyle = this._stroke;  ctx.lineWidth = hr;
      ctx.strokeRect(bx1, by1, w, h);
    });
  }
}

/** Fibonacci retracement levels */
class FibPrimitive {
  constructor(chart, series, t1, p1, t2, p2) {
    this._c = chart; this._s = series;
    this._t1 = Math.min(t1,t2); this._t2 = Math.max(t1,t2);
    this._high = Math.max(p1,p2); this._low = Math.min(p1,p2);
  }
  updateAllViews() {}
  paneViews()  { return [this]; }
  renderer()   { return this; }
  zOrder()     { return 'normal'; }

  draw(target) {
    const LEVELS = [
      {r:0,    lbl:'0%',    clr:'rgba(239,83,80,.95)'},
      {r:.236, lbl:'23.6%', clr:'rgba(255,152,0,.95)'},
      {r:.382, lbl:'38.2%', clr:'rgba(255,235,59,.95)'},
      {r:.5,   lbl:'50%',   clr:'rgba(200,200,200,.8)'},
      {r:.618, lbl:'61.8%', clr:'rgba(76,175,80,.95)'},
      {r:.786, lbl:'78.6%', clr:'rgba(33,150,243,.95)'},
      {r:1.0,  lbl:'100%',  clr:'rgba(156,39,176,.95)'},
    ];
    target.useBitmapCoordinateSpace(({ context: ctx, horizontalPixelRatio: hr, verticalPixelRatio: vr, bitmapSize }) => {
      const x1c = this._c.timeScale().timeToCoordinate(this._t1);
      const x2c = this._c.timeScale().timeToCoordinate(this._t2);
      if (x1c == null || x2c == null) return;
      const bx1 = Math.round(Math.min(x1c,x2c)*hr);
      const bx2 = Math.round(Math.max(x1c,x2c)*hr);
      const range = this._high - this._low;

      LEVELS.forEach(lv => {
        const price = this._high - lv.r * range;
        const yc = this._s.priceToCoordinate(price);
        if (yc == null) return;
        const by = Math.round(yc * vr);

        // Dashed horizontal line
        ctx.beginPath(); ctx.moveTo(bx1, by); ctx.lineTo(bx2, by);
        ctx.strokeStyle = lv.clr; ctx.lineWidth = hr;
        ctx.setLineDash([5*hr, 4*hr]); ctx.stroke(); ctx.setLineDash([]);

        // Background for label
        const labelTxt = `${lv.lbl}  ${price.toFixed(2)}`;
        ctx.font = `bold ${Math.round(9.5*vr)}px Inter,sans-serif`;
        const tw = ctx.measureText(labelTxt).width;
        ctx.fillStyle = 'rgba(13,17,23,.75)';
        ctx.fillRect(bx1+4*hr, by-12*vr, tw+6*hr, 13*vr);
        ctx.fillStyle = lv.clr;
        ctx.fillText(labelTxt, bx1+7*hr, by-2*vr);
      });
    });
  }
}

/** Trend line / Ray primitive */
class LinePrimitive {
  constructor(chart, series, t1, p1, t2, p2, color, isRay) {
    this._c = chart; this._s = series;
    this._t1 = t1; this._p1 = p1; this._t2 = t2; this._p2 = p2;
    this._clr = color; this._ray = isRay;
  }
  updateAllViews() {}
  paneViews()  { return [this]; }
  renderer()   { return this; }
  zOrder()     { return 'normal'; }

  draw(target) {
    target.useBitmapCoordinateSpace(({ context: ctx, horizontalPixelRatio: hr, verticalPixelRatio: vr, bitmapSize }) => {
      const ax = this._c.timeScale().timeToCoordinate(this._t1);
      const bx = this._c.timeScale().timeToCoordinate(this._t2);
      const ay = this._s.priceToCoordinate(this._p1);
      const by_ = this._s.priceToCoordinate(this._p2);
      if (ax==null||bx==null||ay==null||by_==null) return;
      const x1b = Math.round(ax*hr), y1b = Math.round(ay*vr);
      const x2b = Math.round(bx*hr), y2b = Math.round(by_*vr);

      ctx.beginPath(); ctx.moveTo(x1b, y1b);
      if (this._ray && x2b !== x1b) {
        const slope = (y2b-y1b)/(x2b-x1b);
        ctx.lineTo(bitmapSize.width, y1b + slope*(bitmapSize.width-x1b));
      } else {
        ctx.lineTo(x2b, y2b);
      }
      ctx.strokeStyle = this._clr; ctx.lineWidth = 1.5*hr; ctx.stroke();
      [{ x:x1b,y:y1b},{x:x2b,y:y2b}].forEach(p => {
        ctx.beginPath(); ctx.arc(p.x, p.y, 3.5*hr, 0, Math.PI*2);
        ctx.fillStyle = this._clr; ctx.fill();
      });
    });
  }
}

function createChart() {
  const el = document.getElementById('lwc');
  chart = LightweightCharts.createChart(el, {
    layout:  { background:{color:'#0d1117'}, textColor:'#787b86', fontFamily:"'Inter',sans-serif", fontSize:11 },
    grid:    { vertLines:{color:'rgba(255,255,255,0.03)'}, horzLines:{color:'rgba(255,255,255,0.03)'} },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal,
                 vertLine:{color:'#444',width:1,style:1,labelBackgroundColor:'#2a2e39'},
                 horzLine:{color:'#444',width:1,style:1,labelBackgroundColor:'#2a2e39'} },
    rightPriceScale: { borderColor:'#2e3347' },
    timeScale:       { borderColor:'#2e3347', timeVisible:true, secondsVisible:false, barSpacing:7 },
    handleScroll:    { mouseWheel:true, pressedMouseMove:true, horzTouchDrag:true },
    handleScale:     { mouseWheel:true, pinch:true },
  });

  cSeries = chart.addCandlestickSeries({
    upColor:'#00B050', downColor:'#FF3A3A',
    borderUpColor:'#00B050', borderDownColor:'#FF3A3A',
    wickUpColor:'#00B050', wickDownColor:'#FF3A3A',
    priceLineVisible:false,
  });

  chart.subscribeCrosshairMove(onXhair);
  chart.subscribeClick(onChartClick);

  new ResizeObserver(() =>
    chart.applyOptions({ width:el.clientWidth, height:el.clientHeight })
  ).observe(el);
}

// ════════════════════════════════════════════════════════════════
// DATA LOADING — fetch once per TF, replay is 100% local
// ════════════════════════════════════════════════════════════════
async function preload(tf, limit=0) {
  if (_candles[tf]) return;          // already cached
  txt('Loading ' + tf + ' candles…');
  try {
    const r = await fetch(`${window.parent.NEXT_PUBLIC_API_URL || ''}/api/candles?tf=${tf}&limit=${limit}`);
    const d = await r.json();
    // Add unixTime to every candle
    _candles[tf] = d.candles.map(c => ({ ...c, unixTime: ist2unix(c.datetime) }));

    // Update slider
    const sl = document.getElementById('rslider');
    sl.max = _candles[tf].length - 1;
    sl.value = Math.min(currentIdx, _candles[tf].length - 1);

    txt('Loading imbalance zones…');
    const zr = await fetch(`${window.parent.NEXT_PUBLIC_API_URL || ''}/api/imbalances?tf=${tf}`);
    const zd = await zr.json();
    _zones[tf] = zd.zones || [];

  } catch(e) { showToast('⚠️ Load error: ' + e.message); }
}

// ════════════════════════════════════════════════════════════════
// RENDER (called after every tick — uses local cache only)
// ════════════════════════════════════════════════════════════════
function renderAll() {
  const cache = _candles[currentTF];
  if (!cache?.length) return;
  currentIdx = Math.max(0, Math.min(currentIdx, cache.length - 1));

  const visible = cache.slice(0, currentIdx + 1);

  // 1. Candles
  cSeries.setData(visible.map(c => ({
    time:c.unixTime, open:c.open, high:c.high, low:c.low, close:c.close
  })));

  // 2. Zones (persistent primitives, updated in-place)
  updateZones(visible);

  // 3. Indicators (filter pre-computed series to current time)
  const curTime = visible[visible.length - 1].unixTime;
  _inds.forEach(ind => updateIndDisplay(ind, curTime));

  // 4. Status + slider
  updateStatus(visible);
}

// ════════════════════════════════════════════════════════════════
// ZONE RENDERING  ← THE BIG FIX
// Uses RectPrimitive (proper filled rectangles, not AreaSeries).
// Logic is IDENTICAL to Replay_bar.py's calculateTraces():
//   • dtToIdx map gates visibility
//   • endIdx grows to currentIndex OR locks at mitigation
// ════════════════════════════════════════════════════════════════
let _zonePrimList = [];   // Persistent zone primitives (create once per TF)

function initZonePrimitives() {
  // Detach all old zone primitives
  _zonePrimList.forEach(p => { try { cSeries.detachPrimitive(p); } catch(e){} });
  _zonePrimList = [];
  if (!showZones) return;

  const zones = _zones[currentTF] || [];
  // Limit to last 60 zones (performance)
  zones.slice(-60).forEach(zone => {
    const prim = new RectPrimitive(
      chart, cSeries,
      0, zone.top_price,    // t1/top will be set in updateZones
      0, zone.bottom_price, // t2/bot
      'rgba(38,166,154,0.15)', 'rgba(38,166,154,0.7)'
    );
    prim.hide();  // hidden until replay confirms creation
    cSeries.attachPrimitive(prim);
    _zonePrimList.push({ prim, zone });
  });
}

function updateZones(visibleSlice) {
  if (!visibleSlice.length) return;

  // Build dtToIdx  (same variable name as Replay_bar.py — identical logic)
  const dtToIdx = {};
  visibleSlice.forEach((c, idx) => { dtToIdx[c.datetime] = idx; });

  _zonePrimList.forEach(({ prim, zone }) => {
    const cTime = zone.creation_datetime;
    const mTime = zone.mitigation_datetime;
    const isBull = zone.imbalance_type === 'bullish';

    // ── GATE: same as if (cTime in dtToIdx) ──────────────────
    if (!(cTime in dtToIdx)) { prim.hide(); return; }

    prim.show();
    const startIdx = dtToIdx[cTime];

    // ── GROW or LOCK: identical to Replay_bar.py ─────────────
    const isMit = mTime !== 'Active' && mTime in dtToIdx;
    const endIdx = isMit ? dtToIdx[mTime] : visibleSlice.length - 1;

    prim._t1 = visibleSlice[startIdx].unixTime;
    prim._t2 = visibleSlice[endIdx].unixTime;
    prim._top = zone.top_price;
    prim._bot = zone.bottom_price;

    // Colour: active = vivid, mitigated = muted
    if (isBull) {
      prim._fill   = isMit ? 'rgba(38,166,154,0.07)' : 'rgba(38,166,154,0.16)';
      prim._stroke = 'rgba(38,166,154,0.8)';
    } else {
      prim._fill   = isMit ? 'rgba(239,83,80,0.07)'  : 'rgba(239,83,80,0.16)';
      prim._stroke = 'rgba(239,83,80,0.8)';
    }
  });
}

// ════════════════════════════════════════════════════════════════
// REPLAY CONTROLS  (local — zero network calls per tick)
// ════════════════════════════════════════════════════════════════
function stepFwd() {
  const len = _candles[currentTF]?.length;
  if (!len) return;
  if (currentIdx < len - 1) { currentIdx++; renderAll(); }
  else pausePlay();
}
function stepBack() {
  if (currentIdx > 0) { currentIdx--; renderAll(); }
}
function resetReplay() {
  pausePlay(); currentIdx = Math.min(100, (_candles[currentTF]?.length||101)-1); renderAll();
}
function goEnd() {
  pausePlay(); currentIdx = (_candles[currentTF]?.length||1)-1; renderAll();
}
function scrubTo(v) {
  currentIdx = parseInt(v); renderAll();
}
function togglePlay() {
  playInterval ? pausePlay() : startPlay();
}
function startPlay() {
  const b = document.getElementById('btn-play');
  b.textContent='⏸'; b.className='r-btn pause';
  playInterval = setInterval(stepFwd, playDelay);
}
function pausePlay() {
  const b = document.getElementById('btn-play');
  b.textContent='▶'; b.className='r-btn play';
  if (playInterval) { clearInterval(playInterval); playInterval=null; }
}
function setSpeed(v) {
  playDelay = parseInt(v);
  document.getElementById('spd-lbl').textContent = (playDelay/1000).toFixed(1)+'s';
  if (playInterval) { clearInterval(playInterval); startPlay(); }
}

function updateStatus(visible) {
  const c = visible[visible.length-1];
  const p = visible.length>1 ? visible[visible.length-2] : c;
  const chg = ((c.close-p.close)/p.close*100).toFixed(2);
  const sign = c.close >= p.close ? '+' : '';
  document.getElementById('status').textContent =
    `${c.datetime.slice(0,10)}  ${c.datetime.slice(11,16)}  O:${c.open}  H:${c.high}  L:${c.low}  C:${c.close}  ${sign}${chg}%  #${currentIdx+1}/${_candles[currentTF]?.length}`;
  document.getElementById('rslider').value = currentIdx;
}

// ════════════════════════════════════════════════════════════════
// TIMEFRAME SWITCHER
// ════════════════════════════════════════════════════════════════
async function switchTF(tf) {
  if (tf === currentTF) return;
  pausePlay();

  // Highlight button
  document.querySelectorAll('.tf-btn').forEach(b => b.classList.toggle('active', b.dataset.tf===tf));

  // Clear zone primitives
  _zonePrimList.forEach(p => { try { cSeries.detachPrimitive(p.prim); } catch(e){} });
  _zonePrimList = [];

  // Clear indicator series (they'll be recreated on new TF)
  _inds.forEach(ind => {
    Object.values(ind._lwcSeries||{}).forEach(s => { try { chart.removeSeries(s); } catch(e){} });
    ind._lwcSeries = {};
    ind._fullData  = null;   // force recompute
  });

  currentTF = tf;
  showToast('Loading ' + tf + '…');
  await preload(tf);
  currentIdx = Math.min(currentIdx, (_candles[tf]?.length||101)-1);

  initZonePrimitives();

  // Recompute all indicators for new TF
  for (const ind of _inds) await computeFull(ind);
  _inds.forEach(ind => { if (ind.overlay) createOverlaySeries(ind); });

  renderAll();
  fitChart();
  showToast('✅ ' + tf);
  saveLayout();
}

// ════════════════════════════════════════════════════════════════
// ZONE TOGGLE
// ════════════════════════════════════════════════════════════════
function toggleZones() {
  showZones = !showZones;
  document.getElementById('zone-btn').style.opacity = showZones ? '1' : '0.35';
  initZonePrimitives();
  renderAll();
  saveLayout();
}

// INDICATOR FRAMEWORK
// ════════════════════════════════════════════════════════════════
async function loadRegistry() {
  try { _registry = await (await fetch((window.parent.NEXT_PUBLIC_API_URL || '') + '/api/indicators/list')).json(); buildIndUI(); }
  catch(e) { console.error('Registry load failed:', e); }
}

const IND_CATS = {
  'Trend':       ['EMA','SMA','WMA','HMA','VWAP','SuperTrend'],
  'Momentum':    ['RSI','MACD','Stochastic','CCI'],
  'Volatility':  ['ATR','Bollinger Bands','Keltner Channels'],
  'Volume':      ['OBV'],
  'Smart Money': ['FVG','Order Blocks','Imbalance Zones'],
};

function buildIndUI() {
  const list = document.getElementById('ind-list');
  list.innerHTML = '';
  for (const [cat, names] of Object.entries(IND_CATS)) {
    const h = document.createElement('div'); h.className='ind-cat'; h.textContent=cat;
    list.appendChild(h);
    names.forEach(name => {
      const m = _registry.find(r=>r.name===name); if(!m) return;
      const row = document.createElement('div'); row.className='ind-row'; row.dataset.name=name;
      row.innerHTML = `
        <span class="badge ${m.overlay?'b-ovl':'b-pane'}">${m.overlay?'OVL':'PANE'}</span>
        <div><div class="ind-name">${name}</div><div class="ind-desc">${m.description||''}</div></div>
        <button class="add-btn" onclick="addInd('${name}')">+ Add</button>`;
      list.appendChild(row);
    });
  }
}

function filterInds(q) {
  const lq = q.toLowerCase();
  document.querySelectorAll('.ind-row').forEach(el => {
    el.style.display = el.dataset.name.toLowerCase().includes(lq)?'':'none';
  });
  document.querySelectorAll('.ind-cat').forEach(el => {
    let n = el.nextElementSibling, any=false;
    while(n && !n.classList.contains('ind-cat')){ if(n.style.display!=='none') any=true; n=n.nextElementSibling; }
    el.style.display = any?'':'none';
  });
}

async function addInd(name) {
  closePopup('ind-popup');
  const meta = _registry.find(r=>r.name===name); if(!meta) return;
  const id = ++_indId;
  const settings = {};
  meta.schema.forEach(f => settings[f.key]=f.default);
  const ind = { id, name, settings, overlay:meta.overlay, pane:meta.pane, schema:meta.schema, _lwcSeries:{}, _paneSeries:{}, _paneStaticSeries:[] };
  _inds.push(ind);
  showToast('Computing ' + name + '…');
  await computeFull(ind);
  if (ind.overlay) createOverlaySeries(ind);
  else createPaneSeries(ind);
  const cache = _candles[currentTF];
  if (cache?.[currentIdx]) updateIndDisplay(ind, cache[currentIdx].unixTime);
  buildLegend();
  saveLayout();
  showToast('✅ ' + name + ' added');
}

// ── Compute full indicator series from backend (no replay_idx = full history)
async function computeFull(ind) {
  try {
    const resp = await fetch((window.parent.NEXT_PUBLIC_API_URL || '') + '/api/indicators/calculate', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ indicator:ind.name, settings:ind.settings, tf:currentTF }),
    });
    const j = await resp.json();
    if (!j.ok) { showToast('⚠️ '+j.error); return; }
    const data = j.result.data;
    ind._resultMeta = data;
    const cache = _candles[currentTF];
    if (!cache) return;
    const times = cache.map(c=>c.unixTime);
    ind._fullData = buildFullData(ind.name, data, times);
  } catch(e) { showToast('⚠️ '+e.message); }
}

function buildFullData(name, data, times) {
  const mk = arr => (arr||[]).map((v,i)=>v!=null?{time:times[i],value:v}:null).filter(Boolean);
  if (name==='MACD')       return { macd:mk(data.macd), signal:mk(data.signal), hist:(data.histogram||[]).map((v,i)=>v!=null?{time:times[i],value:v,color:v>=0?data.bull_color:data.bear_color}:null).filter(Boolean) };
  if (name==='Stochastic') return { k:mk(data.k), d:mk(data.d) };
  if (name==='Bollinger Bands'||name==='Keltner Channels') return { upper:mk(data.upper), basis:mk(data.basis), lower:mk(data.lower) };
  if (name==='VWAP')       return { main:mk(data.values), upper:mk(data.upper), lower:mk(data.lower) };
  if (name==='SuperTrend') {
    const bull=[], bear=[];
    (data.values||[]).forEach((v,i)=>{ if(v==null) return; (data.direction[i]===1?bull:bear).push({time:times[i],value:v}); });
    return { bull, bear };
  }
  if (name==='FVG'||name==='Order Blocks'||name==='Imbalance Zones') return { zones: data.zones||[] };
  return { main: mk(data.values) };
}

// ── Create LWC series for overlay indicators
function createOverlaySeries(ind) {
  Object.values(ind._lwcSeries||{}).forEach(s=>{ try{chart.removeSeries(s);}catch(e){} });
  ind._lwcSeries = {};
  const d = ind._resultMeta||{};
  const n = ind.name;

  if (n==='Bollinger Bands'||n==='Keltner Channels') {
    const bc = d.band_color||'rgba(33,150,243,.5)';
    ind._lwcSeries.upper = chart.addLineSeries({color:bc,lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dashed,priceLineVisible:false,lastValueVisible:false});
    ind._lwcSeries.basis = chart.addLineSeries({color:d.color||'#9E9E9E',lineWidth:1,priceLineVisible:false,lastValueVisible:true});
    ind._lwcSeries.lower = chart.addLineSeries({color:bc,lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dashed,priceLineVisible:false,lastValueVisible:false});
    ind._color = d.color||'#9E9E9E';
  } else if (n==='VWAP') {
    ind._lwcSeries.main = chart.addLineSeries({color:d.color||'#FFEB3B',lineWidth:d.width||2,priceLineVisible:false,lastValueVisible:true});
    if (d.show_bands) {
      const bc=d.band_color||'rgba(255,235,59,.3)';
      ind._lwcSeries.upper = chart.addLineSeries({color:bc,lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dashed,priceLineVisible:false,lastValueVisible:false});
      ind._lwcSeries.lower = chart.addLineSeries({color:bc,lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dashed,priceLineVisible:false,lastValueVisible:false});
    }
    ind._color = d.color||'#FFEB3B';
  } else if (n==='SuperTrend') {
    ind._lwcSeries.bull = chart.addLineSeries({color:d.bull_color||'#26A69A',lineWidth:d.width||2,priceLineVisible:false,lastValueVisible:false});
    ind._lwcSeries.bear = chart.addLineSeries({color:d.bear_color||'#EF5350',lineWidth:d.width||2,priceLineVisible:false,lastValueVisible:false});
    ind._color = d.bull_color||'#26A69A';
  } else if (n==='FVG'||n==='Order Blocks'||n==='Imbalance Zones') {
    ind._color = n==='FVG'?'#ff9800':(n==='Order Blocks'?'#9c27b0':'#2196F3');
    ind._isZones = true;   // rendered via primitives below
    ind._zonePrims = [];
  } else {
    const clr = d.color||'#2196F3';
    ind._lwcSeries.main = chart.addLineSeries({color:clr,lineWidth:d.width||2,priceLineVisible:false,lastValueVisible:true});
    ind._color = clr;
  }
}

// ── Create sub-panel for pane indicators
function createPaneSeries(ind) {
  const d = ind._resultMeta||{};
  const pid = 'p' + (++_paneId);
  const pEl = document.createElement('div');
  pEl.className='ind-pane'; pEl.id='dom-'+pid; pEl.style.height='145px';
  pEl.innerHTML=`<div class="pane-lbl">${d.label||ind.name}</div>
    <button class="pane-x" onclick="removePaneInd('${pid}',${ind.id})">✕</button>
    <div class="pane-chart-div" id="lwc-${pid}"></div>`;
  document.getElementById('pane-area').appendChild(pEl);

  const pDiv = document.getElementById('lwc-'+pid);
  const pChart = LightweightCharts.createChart(pDiv, {
    layout:{background:{color:'#0d1117'},textColor:'#787b86',fontSize:10},
    grid:{vertLines:{color:'rgba(255,255,255,.02)'},horzLines:{color:'rgba(255,255,255,.02)'}},
    rightPriceScale:{borderColor:'#2e3347'},
    timeScale:{borderColor:'#2e3347',timeVisible:true,visible:false},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
    handleScroll:{mouseWheel:true}, handleScale:{mouseWheel:true},
  });

  // Sync scroll with main chart
  chart.timeScale().subscribeVisibleLogicalRangeChange(range=>{
    if(range) pChart.timeScale().setVisibleLogicalRange(range);
  });

  ind._paneChart = pChart; ind._paneId = pid;
  ind._paneSeries = {}; ind._paneStaticSeries = [];
  const n = ind.name;

  const mkLine = (clr,w=2,style=0) => pChart.addLineSeries({color:clr,lineWidth:w,lineStyle:style,priceLineVisible:false,lastValueVisible:true});

  if (n==='MACD') {
    ind._paneSeries.macd   = mkLine(d.macd_color||'#2196F3');
    ind._paneSeries.signal = mkLine(d.signal_color||'#FF9800',1,LightweightCharts.LineStyle.Dashed);
    ind._paneSeries.hist   = pChart.addHistogramSeries({priceLineVisible:false,lastValueVisible:false,base:0});
  } else if (n==='Stochastic') {
    ind._paneSeries.k = mkLine(d.k_color||'#2196F3');
    ind._paneSeries.d = mkLine(d.d_color||'#FF9800',1,LightweightCharts.LineStyle.Dashed);
    addLevelLines(pChart, ind, [d.upper||80, 50, d.lower||20], ['rgba(239,83,80,.35)','rgba(120,120,120,.25)','rgba(38,166,154,.35)']);
  } else {
    ind._paneSeries.main = mkLine(d.color||'#9C27B0');
    if (d.upper!==undefined) addLevelLines(pChart, ind, [d.upper, 50, d.lower], ['rgba(239,83,80,.35)','rgba(120,120,120,.25)','rgba(38,166,154,.35)']);
  }

  ind._color = d.color||'#9C27B0';
  new ResizeObserver(()=>pChart.applyOptions({width:pDiv.clientWidth,height:pDiv.clientHeight})).observe(pDiv);
}

function addLevelLines(pChart, ind, levels, colors) {
  const cache = _candles[currentTF];
  if (!cache?.length) return;
  const t0=cache[0].unixTime, t1=cache[cache.length-1].unixTime;
  levels.forEach((lvl,i)=>{
    if (lvl==null) return;
    const s = pChart.addLineSeries({color:colors[i],lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dashed,priceLineVisible:false,lastValueVisible:false});
    s.setData([{time:t0,value:lvl},{time:t1,value:lvl}]);
    ind._paneStaticSeries.push(s);
  });
}

// ── Display update — called on every replay tick (NO network)
function updateIndDisplay(ind, curTime) {
  const fd = ind._fullData;
  if (!fd) return;

  if (ind._isZones) {
    // Smart-money zone-based indicators
    renderZoneBasedInd(ind, curTime);
    return;
  }

  if (ind.overlay) {
    Object.entries(ind._lwcSeries).forEach(([key,s])=>{
      const pts=(fd[key]||[]).filter(p=>p.time<=curTime);
      if(pts.length) s.setData(pts);
    });
  } else if (ind._paneChart) {
    Object.entries(ind._paneSeries).forEach(([key,s])=>{
      const pts=(fd[key]||[]).filter(p=>p.time<=curTime);
      if(pts.length) s.setData(pts);
    });
  }
}

function renderZoneBasedInd(ind, curTime) {
  // Remove old indicator zone primitives
  (ind._zonePrims||[]).forEach(p=>{try{cSeries.detachPrimitive(p);}catch(e){}});
  ind._zonePrims=[];
  const fd=ind._fullData;
  if(!fd?.zones) return;
  const isBull = z => z.type==='bull';
  fd.zones.filter(z=>{ const t=_candles[currentTF]?.find(c=>c.unixTime>=ist2unix(z.creation_datetime||'2000-01-01')); return t&&t.unixTime<=curTime; }).slice(-30).forEach(z=>{
    const t1 = ist2unix(z.creation_datetime||'');
    const t2 = curTime;
    if(!t1) return;
    const p = new RectPrimitive(chart,cSeries,t1,z.top,t2,z.bottom,
      isBull(z)?'rgba(38,166,154,0.13)':'rgba(239,83,80,0.13)',
      isBull(z)?'rgba(38,166,154,0.7)':'rgba(239,83,80,0.7)');
    cSeries.attachPrimitive(p);
    ind._zonePrims.push(p);
  });
}

function removeInd(id) {
  const ind = _inds.find(a=>a.id===id); if(!ind) return;
  Object.values(ind._lwcSeries||{}).forEach(s=>{try{chart.removeSeries(s);}catch(e){}});
  (ind._zonePrims||[]).forEach(p=>{try{cSeries.detachPrimitive(p);}catch(e){}});
  if (ind._paneId) removePaneInd(ind._paneId, id);
  _inds = _inds.filter(a=>a.id!==id);
  buildLegend(); saveLayout();
}

function removePaneInd(pid, id) {
  const ind = _inds.find(a=>a.id===id);
  if (ind?._paneChart) ind._paneChart.remove();
  document.getElementById('dom-'+pid)?.remove();
  _inds = _inds.filter(a=>a.id!==id);
  buildLegend(); saveLayout();
}

// ═══ SETTINGS POPUP ═══════════════════════════════
function openSettings(id) {
  const ind = _inds.find(a=>a.id===id); if(!ind) return;
  _editId = id;
  document.getElementById('set-title').textContent = ind.name + ' — Settings';
  const form = document.getElementById('set-form'); form.innerHTML='';
  ind.schema.forEach(f=>{
    const val = ind.settings[f.key]??f.default;
    const row = document.createElement('div'); row.className='set-row';
    let inp='';
    if (f.type==='select') {
      inp=`<select class="set-sel" data-key="${f.key}">${(f.options||[]).map(o=>`<option value="${o}"${o==val?' selected':''}>${o}</option>`).join('')}</select>`;
    } else if (f.type==='color') {
      inp=`<input type="color" class="set-inp" data-key="${f.key}" value="${val}">`;
    } else if (f.type==='bool') {
      inp=`<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" data-key="${f.key}"${val?' checked':''} style="width:15px;height:15px;cursor:pointer"> Enabled</label>`;
    } else {
      inp=`<input type="number" class="set-inp" data-key="${f.key}" value="${val}" step="${f.type==='float'?.1:1}" ${f.min!=null?`min="${f.min}"`:''}${f.max!=null?` max="${f.max}"`:''}>`;
    }
    row.innerHTML=`<div class="set-lbl">${f.label}</div>${inp}`;
    form.appendChild(row);
  });
  document.getElementById('set-popup').classList.add('open');
}

async function applySettings() {
  const ind = _inds.find(a=>a.id===_editId); if(!ind) return;
  document.querySelectorAll('#set-form [data-key]').forEach(el=>{
    const f=ind.schema.find(s=>s.key===el.dataset.key); if(!f) return;
    ind.settings[el.dataset.key] = el.type==='checkbox'?el.checked:(f.type==='int'?parseInt(el.value):(f.type==='float'?parseFloat(el.value):el.value));
  });
  closePopup('set-popup');
  await computeFull(ind);
  if (ind.overlay) createOverlaySeries(ind);
  const cache=_candles[currentTF];
  if(cache?.[currentIdx]) updateIndDisplay(ind,cache[currentIdx].unixTime);
  buildLegend(); saveLayout(); showToast('✅ '+ind.name+' updated');
}

function buildLegend() {
  const el=document.getElementById('legend'); el.innerHTML='';
  _inds.forEach(ind=>{
    const d=document.createElement('div'); d.className='leg-item';
    d.innerHTML=`<div class="leg-dot" style="background:${ind._color||'#888'}"></div>
      <span>${ind.name}</span>
      <button class="leg-gear" onclick="openSettings(${ind.id})" title="Settings">⚙</button>
      <button class="leg-x" onclick="removeInd(${ind.id})" title="Remove">✕</button>`;
    el.appendChild(d);
  });
}

// ════════════════════════════════════════════════════════════════
// DRAWING TOOLS
// ════════════════════════════════════════════════════════════════
function setTool(tool) {
  _tool = tool;
  _drawState = null;
  if (_previewP) { try{cSeries.detachPrimitive(_previewP);}catch(e){} _previewP=null; }
  document.querySelectorAll('.d-btn').forEach(b=>b.classList.toggle('active',b.dataset.tool===tool));
  document.getElementById('lwc').classList.toggle('draw-cursor', tool!=='cursor');
  if (tool==='hline') { showToast('Click on chart to place horizontal line'); }
}

function getSnappedPrice(param) {
  let price = cSeries.coordinateToPrice(param.point?.y);
  if (price == null) return null;
  const bar = param.seriesData.get(cSeries);
  if (bar) {
    const pts = [bar.open, bar.high, bar.low, bar.close];
    let closest = pts[0], minD = Math.abs(price - pts[0]);
    for(let i=1; i<4; i++){
      const d = Math.abs(price - pts[i]);
      if(d < minD){ minD = d; closest = pts[i]; }
    }
    // Only snap if within ~0.3% of the price (acts as magnet)
    if (minD < price * 0.003) price = closest;
  }
  return price;
}

function onChartClick(param) {
  if (_tool==='cursor'||!param.time) return;
  const price = getSnappedPrice(param);
  if (price==null) return;

  if (_tool==='hline') {
    const pl = cSeries.createPriceLine({
      price, color:'#f59e0b', lineWidth:1,
      lineStyle:LightweightCharts.LineStyle.Dashed,
      axisLabelVisible:true, title:`${price.toFixed(2)}`
    });
    _drawings.push({type:'hline', pl});
    setTool('cursor');
    showToast('H-Line @ ' + price.toFixed(2));
    return;
  }

  if (['trendline','ray','rect','fib'].includes(_tool)) {
    if (!_drawState) {
      _drawState = {step:1, t1:param.time, p1:price};
      showToast('Click second point to complete ' + _tool);
    } else {
      finalizeDraw(_tool, _drawState.t1, _drawState.p1, param.time, price);
      _drawState=null;
      if (_previewP){try{cSeries.detachPrimitive(_previewP);}catch(e){} _previewP=null;}
      setTool('cursor');
    }
  }
}

function onXhair(param) {
  // Drawing preview
  if (_drawState?.step===1 && param.time && _tool!=='cursor') {
    const pr = getSnappedPrice(param);
    if (pr!=null) showPreview(_tool, _drawState.t1, _drawState.p1, param.time, pr);
  }

  // Crosshair OHLC display
  const tt = document.getElementById('xhair');
  if (!param.time||!param.seriesData?.size){tt.classList.remove('show');return;}
  const bar = param.seriesData.get(cSeries);
  if (!bar){tt.classList.remove('show');return;}

  // Find candle to get IST time
  const c = _candles[currentTF]?.find(c=>c.unixTime===param.time)||bar;
  const dt = c.datetime||'';
  const chg = ((bar.close-bar.open)/bar.open*100).toFixed(2);
  const pos = parseFloat(chg)>=0;

  // LWC time is treated as UTC visually, so we just use standard local strings
  document.getElementById('xh-date').textContent  = dt.slice(0,10)||'—';
  document.getElementById('xh-time').textContent  = dt.slice(11,16)||'—';
  document.getElementById('xh-o').textContent     = bar.open.toFixed(2);
  document.getElementById('xh-h').textContent     = bar.high.toFixed(2);
  document.getElementById('xh-l').textContent     = bar.low.toFixed(2);
  document.getElementById('xh-c').textContent     = bar.close.toFixed(2);
  const ce = document.getElementById('xh-chg');
  ce.textContent = (pos?'+':'')+chg+'%';
  ce.className   = 'xh-val '+(pos?'xh-green':'xh-red');
  tt.classList.add('show');
}

function showPreview(tool, t1, p1, t2, p2) {
  if (_previewP){try{cSeries.detachPrimitive(_previewP);}catch(e){}}
  if (tool==='rect')   _previewP=new RectPrimitive(chart,cSeries,t1,p1,t2,p2,'rgba(255,235,59,.09)','rgba(255,235,59,.8)');
  else if(tool==='fib') _previewP=new FibPrimitive(chart,cSeries,t1,p1,t2,p2);
  else if(tool==='trendline') _previewP=new LinePrimitive(chart,cSeries,t1,p1,t2,p2,'rgba(245,158,11,.7)',false);
  else if(tool==='ray')       _previewP=new LinePrimitive(chart,cSeries,t1,p1,t2,p2,'rgba(245,158,11,.7)',true);
  else {_previewP=null;return;}
  cSeries.attachPrimitive(_previewP);
}

function finalizeDraw(tool, t1, p1, t2, p2) {
  let obj;
  if (tool==='rect') {
    obj=new RectPrimitive(chart,cSeries,t1,p1,t2,p2,'rgba(255,235,59,.09)','rgba(255,235,59,.85)');
    cSeries.attachPrimitive(obj); _drawings.push({type:'rect',prim:obj});
  } else if (tool==='fib') {
    obj=new FibPrimitive(chart,cSeries,t1,p1,t2,p2);
    cSeries.attachPrimitive(obj); _drawings.push({type:'fib',prim:obj});
  } else if (tool==='trendline') {
    obj=new LinePrimitive(chart,cSeries,t1,p1,t2,p2,'#f59e0b',false);
    cSeries.attachPrimitive(obj); _drawings.push({type:'trendline',prim:obj});
  } else if (tool==='ray') {
    obj=new LinePrimitive(chart,cSeries,t1,p1,t2,p2,'#f59e0b',true);
    cSeries.attachPrimitive(obj); _drawings.push({type:'ray',prim:obj});
  }
}

function clearDrawings() {
  _drawings.forEach(d=>{
    try{
      if(d.pl)   cSeries.removePriceLine(d.pl);
      if(d.prim) cSeries.detachPrimitive(d.prim);
      if(d.s)    chart.removeSeries(d.s);
    }catch(e){}
  });
  _drawings=[];
  showToast('Drawings cleared');
}

// ════════════════════════════════════════════════════════════════
// UTILITIES
// ════════════════════════════════════════════════════════════════
function ist2unix(dtStr) {
  if(!dtStr||dtStr==='Active'||dtStr==='Never Touched') return 0;
  // Trick LWC into displaying exactly the IST string by parsing it as UTC
  return Math.floor(new Date(dtStr.replace(' ','T')+'Z').getTime()/1000);
}

function fitChart()  { chart.timeScale().fitContent(); }

function jumpToDate(dateStr) {
  const cache = _candles[currentTF]; if(!cache) return;
  const target = new Date(dateStr+'T00:00:00Z').getTime()/1000;
  let idx = cache.findIndex(c=>c.unixTime>=target);
  if(idx<0) idx=cache.length-1;
  currentIdx=idx; renderAll(); fitChart();
  showToast('Jumped to '+dateStr+' — bar #'+idx);
}

function takeScreenshot() {
  const cnv=chart.takeScreenshot();
  const a=document.createElement('a');
  a.href=cnv.toDataURL(); a.download=`NIFTY_${currentTF}_${Date.now()}.png`; a.click();
}

function openMonthly() { window.open('file:///f:/Exit time option/techinal imbalance python/monthly_charts/monthly_charts_index.html','_blank'); }
function openIndLib()  { document.getElementById('ind-popup').classList.add('open'); setTimeout(()=>document.getElementById('ind-search').focus(),50); }
function closePopup(id){ document.getElementById(id).classList.remove('open'); }

let _toastT=null;
function showToast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(_toastT); _toastT=setTimeout(()=>t.classList.remove('show'),2800);
}

// ════════════════════════════════════════════════════════════════
// LAYOUT PERSISTENCE
// ════════════════════════════════════════════════════════════════
const LS='nifty_v4';
function saveLayout() {
  try { localStorage.setItem(LS, JSON.stringify({
    tf:currentTF, idx:currentIdx, showZones,
    indicators:_inds.map(a=>({name:a.name,settings:a.settings})),
  })); } catch(e){}
}

async function restoreLayout() {
  let s; try{s=JSON.parse(localStorage.getItem(LS)||'null');}catch(e){}
  if(!s) return;
  if(s.tf&&s.tf!==currentTF){ currentTF=s.tf; document.querySelectorAll('.tf-btn').forEach(b=>b.classList.toggle('active',b.dataset.tf===currentTF)); await preload(currentTF); }
  if(s.idx!==undefined) currentIdx=s.idx;
  if(s.showZones!==undefined) showZones=s.showZones;
  initZonePrimitives();
  if(s.indicators){
    for(const sv of s.indicators){
      const meta=_registry.find(r=>r.name===sv.name); if(!meta) continue;
      const id=++_indId; const settings={};
      meta.schema.forEach(f=>settings[f.key]=f.default);
      Object.assign(settings,sv.settings);
      const ind={id,name:sv.name,settings,overlay:meta.overlay,pane:meta.pane,schema:meta.schema,_lwcSeries:{},_paneSeries:{},_paneStaticSeries:[]};
      _inds.push(ind);
      await computeFull(ind);
      if(ind.overlay) createOverlaySeries(ind); else createPaneSeries(ind);
    }
    buildLegend();
  }
  renderAll();
}

// ════════════════════════════════════════════════════════════════
// KEYBOARD SHORTCUTS
// ════════════════════════════════════════════════════════════════
function bindKeys() {
  document.addEventListener('keydown', e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
    switch(e.key){
      case ' ':         e.preventDefault(); togglePlay();    break;
      case 'ArrowRight':stepFwd();                           break;
      case 'ArrowLeft': stepBack();                          break;
      case 'Home':      resetReplay();                       break;
      case 'End':       goEnd();                             break;
      case 'f':case 'F':fitChart();                          break;
      case 'i':case 'I':openIndLib();                        break;
      case 'h':case 'H':setTool('hline');                    break;
      case 'g':case 'G':setTool('rect');                     break;
      case 'b':case 'B':setTool('fib');                      break;
      case 't':case 'T':setTool('trendline');                break;
      case 'r':case 'R':setTool('ray');                      break;
      case 'v':case 'V':setTool('cursor');                   break;
      case 'Escape':    setTool('cursor'); closePopup('ind-popup'); closePopup('set-popup'); break;
    }
  });
}

// Close on overlay click
document.querySelectorAll('.overlay').forEach(el=>{
  el.addEventListener('click',e=>{ if(e.target===el) el.classList.remove('open'); });
});

document.querySelectorAll('.tf-btn').forEach(b=>b.classList.toggle('active',b.dataset.tf===currentTF));
window.addEventListener('DOMContentLoaded', async ()=>{
  await init();
  initZonePrimitives();  // Create zone primitives after first TF is loaded
  renderAll();
});
