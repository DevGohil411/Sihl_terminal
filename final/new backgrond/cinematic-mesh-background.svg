<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A0D2EB"/>
      <stop offset="35%" stop-color="#E5EAF5"/>
      <stop offset="65%" stop-color="#D0BDF4"/>
      <stop offset="100%" stop-color="#494D5F"/>
    </linearGradient>

    <radialGradient id="bloom-blue" cx="20%" cy="18%" r="48%">
      <stop offset="0%" stop-color="#A0D2EB" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#A0D2EB" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A0D2EB" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bloom-white" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#E5EAF5" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#E5EAF5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E5EAF5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bloom-lavender" cx="82%" cy="20%" r="42%">
      <stop offset="0%" stop-color="#D0BDF4" stop-opacity="0.7"/>
      <stop offset="55%" stop-color="#D0BDF4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#D0BDF4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bloom-purple" cx="68%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#8458B3" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#8458B3" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8458B3" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ground-slate" cx="50%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#494D5F" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#494D5F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#494D5F" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft-noise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#base)"/>
  <rect width="1600" height="900" fill="url(#bloom-blue)"/>
  <rect width="1600" height="900" fill="url(#bloom-white)"/>
  <rect width="1600" height="900" fill="url(#bloom-lavender)"/>
  <rect width="1600" height="900" fill="url(#bloom-purple)"/>
  <rect width="1600" height="900" fill="url(#ground-slate)"/>
  <rect width="1600" height="900" filter="url(#soft-noise)" opacity="0.18"/>
</svg>
